; Pi Zero IP Camera - motion.conf
;
; Minimal configuration for a Raspberry Pi Zero running as a
; single-stream network/IP camera (no motion detection).
;
; Build with detection disabled for maximum CPU efficiency:
;   ./configure --with-libcam --disable-detection
;
; Or use with detection compiled in (slightly higher CPU):
;   ./configure --with-libcam
; and rely on threshold 0 in camera config to suppress detection.

;*************************************************
;*****   Application
;*************************************************
daemon on
log_level 6
log_file /var/log/motion/motion.log

;*************************************************
;*****   Web control
;*************************************************
webcontrol_port 8080
webcontrol_localhost off
webcontrol_parms 2
webcontrol_auth admin:password

;*************************************************
;*****   Cameras
;*************************************************
camera_dir /usr/local/etc/motion/conf.d
