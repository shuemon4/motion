; Pi Zero IP Camera - camera1.conf
;
; Single CSI camera stream configuration for Raspberry Pi Zero.
; All motion detection and recording is disabled to minimize CPU usage.
;
; Pi Zero (original): Use 640x480 @ 10-15 fps
; Pi Zero 2 W:        Use 1280x720 @ 15 fps or 1920x1080 @ 10 fps

;*************************************************
;*****   Camera
;*************************************************
device_name "Pi Zero Camera"
device_id 1

;*************************************************
;*****   Source
;*************************************************
libcam_device 0

;*************************************************
;*****   Image
;*****   Pi Zero W:   640x480 @ 10fps
;*****   Pi Zero 2 W: 1280x720 @ 15fps
;*************************************************
width 1280
height 720
framerate 15

;*************************************************
;*****   Overlays
;*************************************************
text_right %Y-%m-%d\n%T

;*************************************************
;*****   Streaming
;*************************************************
stream_maxrate 15
stream_localhost off

;*************************************************
;*****   Motion detection - DISABLED
;*****   Set threshold 0 to suppress detection
;*****   when built without --disable-detection
;*************************************************
threshold 0
emulate_motion off

;*************************************************
;*****   Recording - DISABLED
;*************************************************
movie_output off
picture_output off
snapshot_interval 0
